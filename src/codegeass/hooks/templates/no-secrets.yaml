# No Secrets Hooks
# Block commits containing API keys or secrets

description: "Prevent committing files that contain API keys or secrets"

hooks:
  PreToolUse:
    - matcher: "Bash"
      hooks:
        - type: command
          command: |
            #!/bin/bash
            # Check if this is a git commit command
            INPUT=$(cat)
            COMMAND=$(echo "$INPUT" | jq -r '.tool_input.command // empty')

            if ! echo "$COMMAND" | grep -qE 'git\s+(commit|add)'; then
              exit 0
            fi

            # Check staged files for secrets
            SECRET_PATTERNS='(api[_-]?key|apikey|secret[_-]?key|password|passwd|token|bearer|auth[_-]?token|access[_-]?token|private[_-]?key|AWS_SECRET|ANTHROPIC_API_KEY|OPENAI_API_KEY)[\s]*[=:]\s*["\x27]?[a-zA-Z0-9_\-]{16,}'

            # Get staged files
            STAGED=$(git diff --cached --name-only 2>/dev/null)

            for FILE in $STAGED; do
              if [ -f "$FILE" ]; then
                if grep -qEi "$SECRET_PATTERNS" "$FILE" 2>/dev/null; then
                  echo "BLOCKED: Potential secret detected in $FILE" >&2
                  echo "Please remove secrets before committing" >&2
                  exit 2
                fi
              fi
            done

            exit 0
          timeout: 10
